permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Large Class Analysis
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129880.yaml
          use-annotations: true
          upload-result: true
