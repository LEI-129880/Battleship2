
name: Unit Test Coverage 129880

on:
  push:
    branches:
      - UnitTests_129880
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Battleship2-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Battleship2-main/pom.xml

      - name: Run tests with JaCoCo coverage
        run: |
          mvn -B \
            org.jacoco:jacoco-maven-plugin:0.8.16:prepare-agent \
            test \
            org.jacoco:jacoco-maven-plugin:0.8.16:report

      - name: Verify coverage report
        run: |
          test -f target/site/jacoco/index.html
          test -f target/site/jacoco/jacoco.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-129880
          path: Battleship2-main/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30
