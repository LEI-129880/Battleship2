version: "1.0"

linter: jetbrains/qodana-jvm-community:2026.2

projectJDK: "17"

profile:
  base:
    name: empty
  inspections:
    - inspection: MethodCount
      enabled: true
      severity: WARNING
      options:
        m_limit: 15
        ignoreGettersAndSetters: false
        ignoreOverridingMethods: false

    - inspection: ClassComplexity
      enabled: true
      severity: WARNING
      options:
        m_limit: 80

failThreshold: 0
